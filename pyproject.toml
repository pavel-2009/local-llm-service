[project]
name = "local-llm-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Павел", email = "ms.radionova@bk.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn[standard,standart]>=0.54.0",
]

[project.scripts]
local-llm-service = "local_llm_service:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
